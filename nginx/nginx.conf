##
## Mwongozo nginx — serves widget JS, admin dashboard, and proxies API calls
##

server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # ── Widget JS ────────────────────────────────────────────────────────────
    # Embed with: <script src="http://your-server/widget.js" data-org="tra">
    location = /widget.js {
        root /usr/share/nginx/html/widget;
        try_files /widget.js =404;
        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin "*";
    }

    location = /widget.dev.js {
        root /usr/share/nginx/html/widget;
        try_files /widget.dev.js =404;
        add_header Access-Control-Allow-Origin "*";
    }

    # ── Admin dashboard ──────────────────────────────────────────────────────
    # Access at: http://your-server/admin/
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # ── Proxy API (all other paths → proxy service) ──────────────────────────
    location / {
        proxy_pass         http://proxy:8787;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

        # Required for SSE (streaming chat responses)
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 120s;

        # CORS — allow widget to call from org domains
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, X-Org-Id, X-User-Role, X-Admin-Secret" always;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "*";
            add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, X-Org-Id, X-User-Role, X-Admin-Secret";
            add_header Access-Control-Max-Age 86400;
            return 204;
        }
    }
}
